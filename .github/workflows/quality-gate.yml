name: Quality Gate

on:
  push:
    branches: ['feature/**']
    paths: ['src/**', 'package*.json']
  pull_request:
    branches: [main]
    paths: ['src/**', 'package*.json']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Archive dist
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-dist-build
          path: dist/
          retention-days: 5
